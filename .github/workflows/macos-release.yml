name: macOS release build

# Builds the universal (arm64 + x64) macOS .app on a real macOS runner — the bundling,
# lipo, dylib fix-ups and ad-hoc signing all need macOS tooling that the Windows/Linux
# packaging can't provide. Fires automatically when a release is published, and can be
# re-run by hand against an existing tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the macOS build to (e.g. v1.7.0)"
        required: true

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout the tagged commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.event.inputs.tag }}

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Resolve tag and version
        id: ver
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building macOS $VERSION for tag $TAG"

      - name: Bake server addresses + stamp version
        env:
          NEXTENDO_SERVER_IP: ${{ secrets.NEXTENDO_SERVER_IP }}
          NEXTENDO_NAT_IP: ${{ secrets.NEXTENDO_NAT_IP }}
        run: |
          if [ -z "$NEXTENDO_SERVER_IP" ] || [ -z "$NEXTENDO_NAT_IP" ]; then
            echo "::error::NEXTENDO_SERVER_IP / NEXTENDO_NAT_IP secrets are not set"; exit 1
          fi
          python3 distribution/nextendo/bake_release.py "${{ steps.ver.outputs.version }}" "${{ github.sha }}"

      - name: Build universal macOS .app
        run: |
          chmod +x distribution/macos/*.sh
          ./distribution/macos/create_macos_build_ava.sh \
            "$PWD" macos_tmp macos_out \
            distribution/macos/entitlements.xml \
            "${{ steps.ver.outputs.version }}" "${{ github.sha }}" Release 0

      - name: Rename artifact
        id: art
        run: |
          SRC=$(ls macos_out/ryujinx-*-macos_universal.app.tar.gz | head -n1)
          if [ -z "$SRC" ] || [ ! -f "$SRC" ]; then
            echo "::error::macOS build produced no artifact"; ls -la macos_out || true; exit 1
          fi
          DST="Ryujinx-Nextendo-${{ steps.ver.outputs.version }}-macos_universal.tar.gz"
          mv "$SRC" "$DST"
          echo "file=$DST" >> "$GITHUB_OUTPUT"
          ls -la "$DST"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.ver.outputs.tag }}" "${{ steps.art.outputs.file }}" \
            --clobber --repo "${{ github.repository }}"
